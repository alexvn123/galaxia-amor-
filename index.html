<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Universo de Amor ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería p5.js MUY ESTABLE, sin errores CORB/CORS -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para ti ✨</h1>
  <p>Cargando estrellas y sentimientos...</p>
</div>

<div id="mensajeInicio">
  <h2>Mi universo eres tú ❤️</h2>
  <button id="entrar">Entrar a nuestro Universo ❤️</button>
</div>

<audio id="musica" loop preload="auto">
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">
  Tu navegador no soporta audio


<script src="sketch.js"></script>

<script>
document.getElementById("mensajeInicio").style.display = "none";

window.onload = function(){
  setTimeout(()=>{
    loader.style.opacity = "0";
    setTimeout(()=>{
      loader.style.display = "none";
      mensajeInicio.style.display = "flex";
    }, 1200);
  }, 2500);

  document.getElementById("entrar").onclick = function(){
    mensajeInicio.style.display = "none";
    iniciarGalaxia(); // Activa el dibujo
    musica.play().catch(e=>console.log("Audio activado:",e));
  };
};
</script>

</body>
</html>
