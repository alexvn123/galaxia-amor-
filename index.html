<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Para Ariana ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- INTRODUCCIÓN -->
    <!-- ============================= -->

    <section id="intro">

        <div class="intro-content">

            <p class="small-title">
                UNA HISTORIA ENTRE ESTRELLAS
            </p>

            <h1>
                Para Ariana
            </h1>

            <div class="line"></div>

            <p class="description">
                Hay personas que llegan por casualidad...
                <br>
                y terminan convirtiéndose en nuestro universo.
            </p>

            <button id="enterButton">
                Entrar a mi universo
                <span>→</span>
            </button>

            <p class="headphones">
                Ponte los audífonos · Sube el volumen
            </p>

        </div>

    </section>


    <!-- ============================= -->
    <!-- UNIVERSO -->
    <!-- ============================= -->

    <section id="universe">

        <canvas id="galaxy"></canvas>


        <!-- FRASE -->

        <div id="phraseContainer">

            <div id="phrase">
                Ariana, tú eres mi universo.
            </div>

        </div>


        <!-- FOTOS -->

        <div id="photos"></div>


        <!-- CONTROLES -->

        <div id="controls">

            <button id="previous">
                ‹
            </button>

            <div id="counter">
                <span id="current">01</span>
                /
                <span id="total">06</span>
            </div>

            <button id="next">
                ›
            </button>

        </div>


        <!-- BOTÓN MÚSICA -->

        <button id="musicButton">
            ♪
        </button>


        <!-- MENSAJE FINAL -->

        <div id="finalMessage">

            <div class="final-small">
                Y SI FUE DESTINO...
            </div>

            <div class="final-big">
                TE ELEGIRÍA<br>
                OTRA VEZ.
            </div>

            <div class="final-name">
                — Ariana ❤️
            </div>

        </div>


        <!-- AUDIO -->

        <audio
            id="music"
            loop
            preload="auto"
        >
<audio
    id="music"
    src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3"
    loop>
    
</audio>

    </section>


    <script src="script.js"></script>

</body>
</html>
