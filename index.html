<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Universo ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================
         ESCENA 3D
    ====================================== -->

    <div id="scene"></div>


    <!-- =====================================
         INTERFAZ
    ====================================== -->

    <div id="interface">


        <div class="title">

            <h1>
                MI UNIVERSO
            </h1>

            <p>
                PARA ARIANA ❤️
            </p>

        </div>


        <!-- FRASE -->

        <div id="phrase"></div>


        <!-- BOTONES -->

        <div class="controls">

            <button
                id="musicButton"
                class="button"
            >
                ▶ MÚSICA
            </button>


            <button
                id="cameraButton"
                class="button"
            >
                🎥 CÁMARA
            </button>


            <button
                id="nextButton"
                class="button"
            >
                ❤️ SIGUIENTE
            </button>

        </div>


        <div class="help">

            Arrastra para mirar ·
            Usa la rueda para acercarte ·
            ❤️ Ariana ❤️

        </div>

    </div>


    <!-- =====================================
         MÚSICA
    ====================================== -->

    <audio
        id="music"
        src="musica/destino.mp3"
        loop
    ></audio>


    <!-- =====================================
         THREE.JS
    ====================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r167/three.min.js">
    </script>


    <!-- =====================================
         NUESTRO JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
