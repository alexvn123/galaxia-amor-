<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Universo ❤️ Galaxia de Amor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para ti ✨</h1>
  <p>Cargando estrellas y sentimientos...</p>
</div>

<div id="mensajeInicio">
  <h2>Mi universo eres tú ❤️</h2>
  <button id="entrar">Entrar a nuestro Universo ❤️</button>
</div>

<audio id="musica" loop preload="auto">
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">


<script src="planetas.js"></script>
<script src="nebulosas.js"></script>
<script src="corazon.js"></script>
<script src="palabras.js"></script>
<script src="main.js"></script>

<script>
document.getElementById("mensajeInicio").style.display = "none";

window.onload = function(){
  // Espera segura a que TODAS las funciones existan
  const esperarListo = setInterval(()=>{
    if (window.THREE && typeof crearGalaxia === "function"){
      clearInterval(esperarListo);
      // Ocultar cargador suavemente
      setTimeout(()=>{
        loader.style.opacity = "0";
        setTimeout(()=>{
          loader.style.display = "none";
          mensajeInicio.style.display = "flex";
        }, 1200);
      }, 2500);
    }
  }, 150);

  document.getElementById("entrar").onclick = function(){
    mensajeInicio.style.display = "none";
    crearGalaxia();
    // Solo llama si existen, sin romper nada
    if (typeof crearCorazon === "function") crearCorazon();
    if (typeof crearPalabras === "function") crearPalabras();
    musica.play().catch(e=>console.log("Audio activado:",e));
  };
};
</script>

</body>
</html>
