<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Universo ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ESCENA 3D -->
    <div id="scene"></div>


    <!-- INTERFAZ -->
    <div id="interface">

        <div class="title">

            <h1>MI UNIVERSO</h1>

            <p>
                PARA ARIANA ❤️
            </p>

        </div>


        <div id="phrase"></div>


        <div class="controls">

            <label class="button">

                📸 FOTOS

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    multiple>

            </label>


            <label class="button">

                🎵 MÚSICA

                <input
                    id="musicInput"
                    type="file"
                    accept="audio/*">

            </label>


            <button
                id="musicButton"
                class="button">

                ▶ MÚSICA

            </button>


            <button
                id="cameraButton"
                class="button">

                🎥 CÁMARA

            </button>


            <button
                id="zoomButton"
                class="button">

                🔭 ZOOM

            </button>

        </div>


        <div class="help">

            Arrastra para mirar ·
            Desliza para explorar ·
            Usa la rueda para acercarte

        </div>

    </div>


    <!-- AUDIO -->

    <audio
        id="music"
        loop>
    </audio>


    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r167/three.min.js"></script>

    <!-- NUESTRO CÓDIGO -->
    <script src="script.js"></script>

</body>

</html>
