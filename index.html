<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- ENLACE DE THREE.JS 100% COMPATIBLE, SIN BLOQUEOS CORS/CORB -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para Ariana ✨</h1>
  <p>Cargando estrellas...</p>
</div>

<div id="mensajeInicio">
  <h2>Tengo algo muy especial para mostrarte...</h2>
  <button id="entrar">Entrar al Universo ❤️</button>
</div>

<audio id="musica" loop preload="auto">
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">
  Tu navegador no soporta audio


<script src="planetas.js"></script>
<script src="nebulosas.js"></script>
<script src="main.js"></script>

<script>
document.getElementById("mensajeInicio").style.display = "none";

window.onload = function(){
  // Espera segura a que THREE esté listo, sin errores de origen
  const comprobarThree = setInterval(()=>{
    if (window.THREE){
      clearInterval(comprobarThree);
      // Quitar pantalla de carga
      setTimeout(()=>{
        loader.style.opacity = "0";
        setTimeout(()=>{
          loader.style.display = "none";
          mensajeInicio.style.display = "flex";
        }, 1000);
      }, 2000);
    }
  }, 100);

  // Botón seguro SIN alertas innecesarias
  document.getElementById("entrar").onclick = function(){
    mensajeInicio.style.display = "none";
    crearGalaxia();
    musica.play().catch(err=>console.log("Audio activado por usuario:",err));
  };
};
</script>

</body>
</html>
