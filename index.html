<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- ÚNICA versión válida de Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
  <style>
    /* Pequeño arreglo para que el lienzo no quede oculto por error */
    canvas { z-index: 1; }
  </style>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para Ariana ✨</h1>
  <p>Cargando estrellas...</p>
</div>

<div id="mensajeInicio">
  <h2>Tengo algo muy especial para mostrarte...</h2>
  <button id="entrar">Entrar al Universo ❤️</button>
</div>

<audio id="musica" loop>
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">


<script src="planetas.js"></script>
<script src="nebulosas.js"></script>
<script src="main.js"></script>

<script>
document.getElementById('entrar').addEventListener('click', () => {
  document.getElementById('musica').play();
  document.getElementById('mensajeInicio').style.display = 'none';
  document.getElementById('loader').style.display = 'none';
  // Aseguramos que la escena se dibuje bien al activar
  setTimeout(crearGalaxia, 50);
});
</script>

</body>
</html>
