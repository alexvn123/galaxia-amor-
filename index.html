<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería fiable y cargada primero -->
  <script src="https://unpkg.com/three@0.167.1/build/three.min.js"></script>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para Ariana ✨</h1>
  <p>Cargando estrellas...</p>
</div>

<div id="mensajeInicio">
  <h2>Tengo algo muy especial para mostrarte...</h2>
  <button id="entrar">Entrar al Universo ❤️</button>
</div>

<audio id="musica" loop preload="auto">
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">
  Tu navegador no soporta audio


<script src="planetas.js"></script>
<script src="nebulosas.js"></script>
<script src="main.js"></script>

<script>
// Ocultar mensaje al inicio por código para seguridad
document.getElementById("mensajeInicio").style.display = "none";

// Temporizador de carga seguro
window.onload = function(){
  setTimeout(()=>{
    document.getElementById("loader").style.opacity = "0";
    setTimeout(()=>{
      document.getElementById("loader").style.display = "none";
      document.getElementById("mensajeInicio").style.display = "flex";
    }, 1000);
  }, 2000);

  // Botón seguro con comprobación total
  document.getElementById("entrar").onclick = function(){
    document.getElementById("mensajeInicio").style.display = "none";
    if (typeof THREE !== "undefined"){
      crearGalaxia();
      document.getElementById("musica").play().catch(e=>{
        alert("Haz clic otra vez para activar el audio");
        console.log(e);
      });
    } else {
      alert("Error de carga: recarga la página (Ctrl+F5)");
      location.reload();
    }
  };
};
</script>

</body>
</html>
