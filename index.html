<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Love ❤️</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
  <style>
    canvas { z-index: 2 !important; display:block; }
  </style>
</head>
<body>

<div id="loader">
  <h1>✨ Creando un universo para Ariana ✨</h1>
  <p>Cargando estrellas...</p>
</div>

<div id="mensajeInicio">
  <h2>Tengo algo muy especial para mostrarte...</h2>
  <button id="entrar">Entrar al Universo ❤️</button>
</div>

<audio id="musica" loop>
  <source src="assets/audio/Melendi - Destino o Casualidad ft. HaAsh.mp3" type="audio/mpeg">


<script src="planetas.js"></script>
<script src="nebulosas.js"></script>
<script src="main.js"></script>

<script>
// Arreglo de sincronización clave
document.getElementById("entrar").addEventListener("click", async () => {
  // Ocultar primero
  document.getElementById("mensajeInicio").style.display = "none";
  document.getElementById("loader").style.display = "none";
  // Pequeña pausa para que el navegador limpie la pantalla
  await new Promise(res => setTimeout(res, 100));
  // Crear galaxia y asegurar renderizado inicial
  crearGalaxia();
  renderer.render(scene, camera);
  // Reproducir audio al final
  document.getElementById("musica").play().catch(e=>console.log(e));
});
</script>

</body>
</html>
